plugins {
    id 'com.android.application'
}

// Ключ подписи и пароли — из app/keystore.properties (не в репозитории, см. .gitignore):
//   storeFile=argeda-release.jks   (путь относительно папки app, можно абсолютный)
//   storePassword=…  keyAlias=…  keyPassword=…
// Есть файл — release-сборка выходит сразу подписанной; нет — собирается неподписанной.
def keystorePropsFile = rootProject.file('app/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'ru.argeda.cabinet'
    compileSdk 35

    defaultConfig {
        minSdk 29
        targetSdk 35
        versionCode 8
        versionName '1.7'
        // Песочница — отдельная сборка (см. sandbox ниже); у живых кабинетов выключено
        buildConfigField 'boolean', 'SANDBOX', 'false'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                def store = file(keystoreProps['storeFile'])
                storeFile store.isAbsolute() ? store : rootProject.file('app/' + keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            debuggable false
            // Без сжатия кода: приложение маленькое, а мост со страницей (JavascriptInterface) и службы должны остаться как есть
            minifyEnabled false
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Один код — четыре кабинета и Песочница. Разновидность выбирает кабинет.
    // Копии кабинетов для kopiya.argeda.ru (до 1.6) заменены одним приложением «ARGEDA Песочница».
    flavorDimensions = ['cabinet']
    productFlavors {
        seller {
            dimension 'cabinet'
            applicationId 'ru.argeda.seller'
            manifestPlaceholders = [cabinetHost: 'seller.argeda.ru']
            buildConfigField 'String', 'CABINET', '"seller"'
            buildConfigField 'String', 'HOST', '"seller.argeda.ru"'
            buildConfigField 'String', 'START_PATH', '"/"'
            resValue 'string', 'app_name', 'ARGEDA Продавец'
        }
        pvz {
            dimension 'cabinet'
            applicationId 'ru.argeda.pvz'
            manifestPlaceholders = [cabinetHost: 'pvz.argeda.ru']
            buildConfigField 'String', 'CABINET', '"pvz"'
            buildConfigField 'String', 'HOST', '"pvz.argeda.ru"'
            buildConfigField 'String', 'START_PATH', '"/"'
            resValue 'string', 'app_name', 'ARGEDA Пункт'
        }
        courier {
            dimension 'cabinet'
            applicationId 'ru.argeda.courier'
            manifestPlaceholders = [cabinetHost: 'courier.argeda.ru']
            buildConfigField 'String', 'CABINET', '"courier"'
            buildConfigField 'String', 'HOST', '"courier.argeda.ru"'
            buildConfigField 'String', 'START_PATH', '"/"'
            resValue 'string', 'app_name', 'ARGEDA Курьер'
        }
        admin {
            dimension 'cabinet'
            applicationId 'ru.argeda.admin'
            manifestPlaceholders = [cabinetHost: 'admin.argeda.ru']
            buildConfigField 'String', 'CABINET', '"admin"'
            buildConfigField 'String', 'HOST', '"admin.argeda.ru"'
            buildConfigField 'String', 'START_PATH', '"/"'
            resValue 'string', 'app_name', 'ARGEDA Админ'
        }
        // Песочница для проверок: покупатель и все кабинеты, только на копии сайта kopiya.argeda.ru.
        // Живой сайт из неё не открывается, сверху всегда оранжевая полоса «Песочница».
        sandbox {
            dimension 'cabinet'
            applicationId 'ru.argeda.sandbox'
            manifestPlaceholders = [cabinetHost: 'kopiya.argeda.ru']
            buildConfigField 'String', 'CABINET', '"sandbox"'
            buildConfigField 'String', 'HOST', '"kopiya.argeda.ru"'
            buildConfigField 'String', 'START_PATH', '"/"'
            buildConfigField 'boolean', 'SANDBOX', 'true'
            resValue 'string', 'app_name', 'ARGEDA Песочница'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
