plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Ключ подписи и пароли — из keystore.properties (не в репозитории, см. .gitignore).
// Без файла релиз просто соберётся неподписанным, отладочная сборка работает всегда.
def keystorePropsFile = rootProject.file('app/keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'ru.argeda.design'
    compileSdk 35

    defaultConfig {
        applicationId 'ru.argeda.design'
        minSdk 26
        targetSdk 35
        versionCode 25
        versionName '1.24'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                storeFile rootProject.file('app/' + keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Для RuStore: без отладки, со сжатием и обфускацией кода
            debuggable false
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // Старые предупреждения SDK не должны останавливать сборку релиза
        abortOnError false
    }
}

// Kotlin. Лямбды и «fun interface» собираются обычными классами, а не через invokedynamic:
// в dex не должно быть LambdaMetafactory (проверка в .github/workflows/android.yml).
// Проверки null на входе методов выключены: поведение как было на Java (WebView и Android иногда передают null).
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        freeCompilerArgs.addAll([
                '-Xlambdas=class',
                '-Xsam-conversions=class',
                '-Xstring-concat=inline',
                '-Xno-param-assertions',
                '-Xno-call-assertions',
                '-Xno-receiver-assertions',
        ])
    }
}
